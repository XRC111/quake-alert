name: Build All Targets

# 默认 GITHUB_TOKEN 是只读的：打 tag 发布 Release 需要写权限，
# 否则 softprops/action-gh-release 会 403 Resource not accessible by integration
permissions:
  contents: write

on:
  push:
    branches: [ main, master, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_ios:
        description: '同时编译 iOS framework / XCFramework'
        type: boolean
        default: true

# 同一分支上重复 push 时取消旧的运行，省 Runner 时长
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'

jobs:
  build:
    name: Android + iOS + Desktop (macOS Runner)
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      # 原 android-actions/setup-android@v3 会执行 `sdkmanager "tools"`，
      # 但 Google 已下架 tools 包，导致 "Failed to find package 'tools'" 直接失败。
      # 改为自己装 command-line tools，版本可控。
      - name: 安装 Android command-line tools
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/cmdline-tools.zip" \
            https://dl.google.com/android/repository/commandlinetools-mac-11076708_latest.zip
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$SDK/cmdline-tools"
          rm -rf "$SDK/cmdline-tools/latest"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      # compileSdk 37（miuix 0.9.2 要求）对应仓库里的 platforms;android-37.0。
      # 构建脚本已声明 compileSdkMinor = 0，AGP 会按 hash "android-37.0" 查找，
      # 因此这里只要把包装上即可，不再改写目录名/package.xml。
      # 注意：YAML 块标量里的 heredoc 终止符不能缩进，否则后续命令会被吞掉；
      # 这里全程用 printf / 普通命令，避免该陷阱。
      - name: 安装 Android SDK Platform 37
        run: |
          set -euo pipefail
          # sdkmanager 读 license 会等待输入；`yes` 退出产生的 SIGPIPE 在 pipefail 下
          # 会被当成失败，所以显式忽略。
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
          # AGP 8.13 默认 build-tools 35.0.0，提前装好省一次下载
          sdkmanager "build-tools;35.0.0" > /dev/null || true

          if [ ! -f "$ANDROID_HOME/platforms/android-37.0/android.jar" ]; then
            echo "::error::platforms;android-37.0 安装失败（缺 android.jar）"
            ls -la "$ANDROID_HOME/platforms" || true
            exit 1
          fi
          echo "--- platforms ---"
          ls "$ANDROID_HOME/platforms"

      - name: Setup Gradle (缓存 + 构建扫描)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # ------------------------------------------------------------------
      # 敏感信息：全部来自 GitHub Secrets，运行期写入 $GITHUB_ENV，
      # 绝不以明文出现在日志里（add-mask 已由 Secrets 机制自动处理）。
      # 注意：secrets 上下文不能用于 if: 条件，只能经 env 传递后在脚本中判空。
      # ------------------------------------------------------------------
      - name: 注入 Android 签名证书
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "未配置签名 Secrets，跳过签名注入（release 将回落到 debug 签名）"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/quake.jks"
          {
            echo "KEYSTORE_FILE=$RUNNER_TEMP/quake.jks"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: 注入 macOS 公证凭据（可选）
        env:
          NOTARIZATION_TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}
          NOTARIZATION_APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
          NOTARIZATION_IDENTITY: ${{ secrets.NOTARIZATION_IDENTITY }}
        run: |
          set -euo pipefail
          if [ -z "${NOTARIZATION_TEAM_ID:-}" ]; then
            echo "未配置 macOS 公证凭据，跳过（不影响 Android/Desktop 产物）"
            exit 0
          fi
          {
            echo "NOTARIZATION_TEAM_ID=$NOTARIZATION_TEAM_ID"
            echo "NOTARIZATION_APPLE_ID=$NOTARIZATION_APPLE_ID"
            echo "NOTARIZATION_PASSWORD=$NOTARIZATION_PASSWORD"
            echo "NOTARIZATION_IDENTITY=$NOTARIZATION_IDENTITY"
          } >> "$GITHUB_ENV"

      # ------------------------------------------------------------------
      # 1) 单元测试（commonTest 在 Desktop JVM 上执行）
      #    以前 CI 只编译不跑测试，去重/解码/规则引擎的回归无人拦截
      # ------------------------------------------------------------------
      - name: 单元测试（Desktop JVM）
        run: ./gradlew :composeApp:desktopTest --stacktrace

      # ------------------------------------------------------------------
      # 2) 编译校验（commonMain 全平台 KLib 编译）
      # ------------------------------------------------------------------
      - name: 全平台编译校验
        run: ./gradlew :composeApp:compileKotlinDesktop :composeApp:compileKotlinIosArm64 :composeApp:compileKotlinIosSimulatorArm64 --stacktrace

      # ------------------------------------------------------------------
      # 2) Android APK / AAB
      # ------------------------------------------------------------------
      - name: 构建 Android Debug APK
        run: ./gradlew :composeApp:assembleDebug --stacktrace

      - name: 构建 Android Release APK + AAB
        run: ./gradlew :composeApp:assembleRelease :composeApp:bundleRelease --stacktrace

      # ------------------------------------------------------------------
      # 3) iOS framework / XCFramework
      #    产物给 Xcode 工程或 SPM 集成使用
      # ------------------------------------------------------------------
      - name: 构建 iOS XCFramework
        if: ${{ github.event.inputs.build_ios != 'false' }}
        run: ./gradlew :composeApp:assembleComposeAppXCFramework --stacktrace

      # ------------------------------------------------------------------
      # 4) 桌面端：macOS Runner 上产出 DMG
      #    （Windows 的 Msi/Exe 由单独的 windows-latest job 负责）
      # ------------------------------------------------------------------
      - name: 构建桌面端 DMG（macOS）
        run: ./gradlew :composeApp:packageReleaseDistributionForCurrentOS --stacktrace

      # ------------------------------------------------------------------
      # 产物归档
      # ------------------------------------------------------------------
      - name: 上传 Android 产物
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            composeApp/build/outputs/apk/**/*.apk
            composeApp/build/outputs/bundle/**/*.aab
          if-no-files-found: error

      - name: 上传 iOS XCFramework
        if: ${{ github.event.inputs.build_ios != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcframework
          path: composeApp/build/XCFrameworks/**
          if-no-files-found: error

      - name: 上传桌面端产物
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: |
            composeApp/build/compose/binaries/main-release/dmg/*
          if-no-files-found: error

      # 打 tag 时自动创建 Release 并把三端产物挂上去
      - name: 发布 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            composeApp/build/outputs/apk/release/*.apk
            composeApp/build/outputs/bundle/release/*.aab
            composeApp/build/compose/binaries/main-release/dmg/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ----------------------------------------------------------------------
  # Windows 端：Msi / Exe 只能在 Windows Runner 上打
  # ----------------------------------------------------------------------
  build-windows:
    name: Desktop (Windows Runner)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # jpackage 打包 Exe/Msi 依赖 WiX（candle.exe/light.exe）。
      # windows-latest 预装 WiX 3.14.1，但 jpackage(JDK17) 与 3.14 存在兼容问题，
      # 显式降级到 compose 插件同款 wix311（3.11.2）
      # Chocolatey 上的 wixtoolset 3.11.2 已不可用（步骤会直接失败），
      # 改成官方 release 的二进制包，解压后加入 PATH（jpackage 通过 PATH 找 candle/light）。
      - name: 安装 WiX Toolset 3.11
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "wix311.zip"
          Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3112rtm/wix311-binaries.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath (Join-Path $env:RUNNER_TEMP "wix311") -Force
          Join-Path $env:RUNNER_TEMP "wix311" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $env:RUNNER_TEMP "wix311" "candle.exe") -? | Select-Object -First 1

      - name: 构建桌面端 Msi / Exe
        id: package
        run: .\gradlew.bat :composeApp:packageReleaseDistributionForCurrentOS --stacktrace
        continue-on-error: true

      # jpackage 的工具 stderr 默认只写 runner 本地文件，这里兜底打印到 workflow 日志
      - name: 打印 jpackage 工具日志（诊断）
        if: steps.package.outcome == 'failure'
        shell: pwsh
        run: |
          Get-ChildItem -Path composeApp/build/compose/logs -Recurse -Filter "*.txt" -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "===== $($_.FullName) ====="
            Get-Content $_.FullName -ErrorAction SilentlyContinue
          }

      - name: 上传 Windows 安装包
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            composeApp/build/compose/binaries/main-release/**/*.msi
            composeApp/build/compose/binaries/main-release/**/*.exe
          if-no-files-found: error

      # 打 tag 时把 Msi/Exe 也挂到同一个 Release。
      # Release 由 macOS job 的 softprops 创建；两个 job 并行，直接调用会撞上
      # “release already exists” 竞争，所以这里先轮询等待 Release 出现，再用
      # gh release upload --clobber 追加附件（macOS job 失败时自行兜底创建）。
      - name: 上传 Windows 安装包到 Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.package.outcome == 'success'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $repo = $env:GITHUB_REPOSITORY
          $ready = $false
          for ($i = 0; $i -lt 60; $i++) {
            gh release view $tag --repo $repo *> $null
            if ($LASTEXITCODE -eq 0) { $ready = $true; break }
            Start-Sleep -Seconds 10
          }
          if (-not $ready) {
            Write-Host "Release $tag 尚未创建，由 Windows job 兜底创建"
            gh release create $tag --repo $repo --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "创建 Release 失败" }
          }
          $files = @(Get-ChildItem -Path "composeApp/build/compose/binaries/main-release" -Recurse -Include *.msi, *.exe)
          if ($files.Count -eq 0) { throw "未找到 Msi/Exe 产物" }
          foreach ($f in $files) {
            Write-Host "上传 $($f.FullName)"
            gh release upload $tag $f.FullName --repo $repo --clobber
            if ($LASTEXITCODE -ne 0) { throw "上传 $($f.Name) 失败" }
          }
