[versions]
# AGP 8.13.2：8.x 最终稳定版，SDK 解析器支持 minor 版本包（android-37.0）
agp = "8.13.2"
android-compileSdk = "37"
android-minSdk = "24"
android-targetSdk = "35"
androidx-activityCompose = "1.10.1"
androidx-coreKtx = "1.15.0"
# 注意：JetBrains 多平台 lifecycle 版本线独立于 androidx（2.8.7 不存在，2.8.4 为 CMP 1.8 同期稳定版）
# CMP 1.11.1 配套 lifecycle 2.11.0-beta01；先用 2.8.4 验证，若运行时冲突再升
androidx-lifecycle = "2.8.4"
# CMP 1.11.1：miuix 0.9.2 编译自 foundation 1.11.1 / material3-window-size 1.9.0，
# 锁 1.8.0 会导致 Android 打开即闪退（运行时二进制不兼容）
compose-multiplatform = "1.11.1"
# Kotlin 2.4.10：miuix 0.9.x 系列全部用 Kotlin 2.3+ 编译（0.9.2=2.4.0），
# 2.1.20 无法消费其元数据（incompatible metadata 2.4.0 vs 2.1.0）。
# KGP 2.4.10 兼容 Gradle 7.6.3~9.5.0、最低 AGP 8.5.2，本工程 8.11.1/8.7.3 均满足。
kotlin = "2.4.10"
kotlinx-coroutines = "1.10.2"
# 0.8.0 起 Instant/Clock 迁到 stdlib kotlin.time；用 -0.6.x-compat 兼容包保留 kotlinx.datetime.Clock API
kotlinx-datetime = "0.8.0-0.6.x-compat"
kotlinx-serialization = "1.8.1"
ktor = "3.1.0"
miuix = "0.9.2"

[libraries]
# ---- 网络 ----
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-websockets = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
# 各平台引擎（由 Ktor 的 ServiceLoader 自动选取，必须随目标平台一起打包）
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }

# ---- 异步 / 序列化 ----
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# ---- lifecycle (JetBrains 多平台版) ----
androidx-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }

# ---- UI（Miuix：MIUI / HyperOS 风格 Compose Multiplatform 组件库）----
miuix-ui = { module = "top.yukonga.miuix.kmp:miuix-ui", version.ref = "miuix" }

# ---- Android 专有 ----
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activityCompose" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-coreKtx" }

# ---- 测试 ----
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
